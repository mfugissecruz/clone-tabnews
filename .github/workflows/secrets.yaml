# .github/workflows/secrets.yml

name: secret-scan
on: [pull_request, push]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --fail
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -sSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/^v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
      - name: Gitleaks scan (git history)
        run: ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://user:password@localhost:5432/db
      - name: Gitleaks scan (build output)
        run: ./gitleaks detect --source .next --config .gitleaks.toml --verbose --redact --no-git